<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;  
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0ACEFE, #2699FB);
        }

        .mains {
            width: 350px;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .2);
        }

        .display {
            width: 100%;
            height: 70px;
            border: none;
            outline: none;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: right;
            padding: 15px;
            font-size: 32px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 22px;
        }



        .num {
            background: #f1f1f1;
        }

        .opt {
            background: black;
            color: #fff;
        }

        .clear {
            background: purple;
            color: #fff;
        }

        .equal {
            background: purple;
            color: #fff;
            grid-column: span 2;
        }
    
    </style>
</head>
<body>
    <div class="mains">

        <input type="text" id="DISPLAY" class="display" readonly="">

        <div class="buttons">
            <button class="clear" onclick="FORMATE()">AC</button>
            <button class="opt" onclick="DIGIT('/')">/</button>
            <button class="opt" onclick="DIGIT('*')">*</button>
            <button class="opt" onclick="BKSP()">⌫</button>

            <button class="num" onclick="DIGIT('7')">7</button>
            <button class="num" onclick="DIGIT('8')">8</button>
            <button class="num" onclick="DIGIT('9')">9</button>
            <button class="opt" onclick="DIGIT('-')">-</button>

            <button class="num" onclick="DIGIT('4')">4</button>
            <button class="num" onclick="DIGIT('5')">5</button>
            <button class="num" onclick="DIGIT('6')">6</button>
            <button class="opt" onclick="DIGIT('+')">+</button>

            <button class="num" onclick="DIGIT('1')">1</button>
            <button class="num" onclick="DIGIT('2')">2</button>
            <button class="num" onclick="DIGIT('3')">3</button>
            <button class="opt" onclick="DIGIT('%')">%</button>

            <button class="num" onclick="DIGIT('0')">0</button>
            <button class="num" onclick="DIGIT('.')">.</button>
            <button class="equal" onclick="calculation()">=</button>
        </div>

    </div>
    <script src="main.js">
        
    
    </script>
    
</body>
</html>
